name: Tag and pre deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
permissions:
  id-token: write
  contents: write
jobs:
  pre-deploy:
    runs-on: ubuntu-latest
    environment: drdev
    steps:
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: true
      - run: pip install requests
      - id: next-tag
        uses: nationalarchives/tdr-github-actions/.github/actions/get-next-version@714115ab533f9f6b0b4fed5a4293e9d57c2b89d8 # v0.0.44
        with:
          repo-name: tdr-keycloak-user-management
          snapshot: ${{ inputs.snapshot }}
      - name: Configure AWS credentials from management account
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MANAGEMENT_ACCOUNT }}:role/TDRGithubActionsRoleMgmt
          aws-region: eu-west-2
          role-session-name: APIDownloadDependencies
      - name: Build jar file
        run: sbt assembly
      - name: Copy artifact to S3
        env:
          CODE_BUCKET_NAME: ${{ format('tdr-backend-code-mgmt-{0}-eu-west-2-an', secrets.MANAGEMENT_ACCOUNT) }}
        run: |
          aws s3 cp target/scala-2.13/keycloak-user-management.jar "s3://$CODE_BUCKET_NAME/keycloak-user-management/${{ steps.next-tag.outputs.next-version }}/keycloak-user-management.jar"
#          gh release create ${{ steps.bump-semver.outputs.new_version }} target/scala-2.13/keycloak-user-management.jar
      - name: Tag release
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          NEXT_VERSION: ${{ steps.next-tag.outputs.next-version }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag "${NEXT_VERSION}"
          git push origin "${NEXT_VERSION}"
      - name: Deploy to drdev
        run: |
          gh workflow run deploy.yml --ref "$WORKFLOW_REF" \
            -f environment=drdev \
            -f toDeploy=${{ steps.next-tag.outputs.next-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
