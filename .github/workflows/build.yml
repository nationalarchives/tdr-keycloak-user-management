name: Tag and pre deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
permissions:
  id-token: write
  contents: write
jobs:
  pre-deploy:
    runs-on: ubuntu-latest
    environment: drdev
    steps:
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: true
      - run: pip install requests
      - id: next-tag
        uses: nationalarchives/tdr-github-actions/.github/actions/get-next-version@714115ab533f9f6b0b4fed5a4293e9d57c2b89d8 # v0.0.44
        with:
          repo-name: tdr-keycloak-user-management
          snapshot: ${{ inputs.snapshot }}
      - name: Echo next version
        run: echo "Next version is ${{ steps.next-tag.outputs.next-version }}"
